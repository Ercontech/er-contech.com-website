name: Deploy to GoDaddy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.c8w.fa8.mytemp.website
          username: ${{ secrets.GODADDY_FTP_USER }}
          password: ${{ secrets.GODADDY_FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          # Switched to plain FTP; GoDaddy sometimes rejects FTPS with 530
          # New FTP user rooted at /home/cxvetl8k679h/
