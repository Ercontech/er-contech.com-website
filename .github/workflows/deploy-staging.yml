name: Deploy to GoDaddy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.c8w.fa8.mytemp.website
          username: ${{ secrets.GODADDY_FTP_USER }}
          password: ${{ secrets.GODADDY_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /
          # FTP user is scoped under the temp domain. Using / places files
          # at the document root of c8w.fa8.mytemp.website.
