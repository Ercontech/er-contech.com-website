name: Deploy to GoDaddy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.yourdomain.com          # Replace with the FTP host from GoDaddy for c8w.fa8.mytemp.website
          username: ${{ secrets.GODADDY_FTP_USER }}
          password: ${{ secrets.GODADDY_FTP_PASS }}
          protocol: ftps                      # Preferred; change to ftp if needed
          local-dir: ./dist/
          server-dir: /public_html/           # Adjust to the document root of the temporary domain
          # server-dir: /public_html/staging/ # Alternative if using a subfolder
