name: Deploy to GoDaddy Staging

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy dist/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.c8w.fa8.mytemp.website
          username: ${{ secrets.GODADDY_FTP_USER }}
          password: ${{ secrets.GODADDY_FTP_PASS }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: /public_html/
          # If the files land in the wrong place, change server-dir to the
          # document root shown in your GoDaddy panel for this temporary domain
          # (sometimes / or a specific folder name).
